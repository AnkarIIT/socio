services:
  postgres:
    image: postgres:16-alpine
    container_name: bharat-postgres
    environment:
      POSTGRES_USER: bharat
      POSTGRES_PASSWORD: bharat
      POSTGRES_DB: bharat
    ports:
      - "5432:5432"
    volumes:
      - bharat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bharat -d bharat"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bharat-redis
    ports:
      - "6379:6379"
    volumes:
      - bharat_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bharat_pgdata:
  bharat_redisdata:
